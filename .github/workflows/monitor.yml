name: Linguaviva Session Monitor

on:
  schedule:
    # Esegue lo script ogni 15 minuti
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Permette di avviare il monitoraggio manualmente su GitHub con un click

permissions:
  contents: write

jobs:
  check-sessions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esecuzione monitoraggio Linguaviva
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Salva stato aggiornato su GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_sessions.json
          git status
          git diff-index --quiet HEAD || (
            git commit -m "update: aggiornato stato sessioni Linguaviva [skip ci]" && \
            git pull --rebase origin main && \
            git push
          )
